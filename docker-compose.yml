services:
  postgres:
    image: postgres:16-alpine
    container_name: sanad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sanad_youth
    ports:
      - "5432:5432"
    volumes:
      - sanad_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sanad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sanad_redis_data:/data

volumes:
  sanad_pg_data:
  sanad_redis_data:
